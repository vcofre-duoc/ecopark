# ECOPARK 3.0: configura la misma base MySQL utilizada en la versión 2.0.
# CONFIGURACIÓN DE MYSQL LOCAL — EDITAR ANTES DE EJECUTAR
# Sustituye NOMBRE_DE_TU_BD por la base que ya tienes creada en MySQL.
# El puerto por defecto suele ser 3306.
db.url=jdbc:mysql://localhost:3306/NOMBRE_DE_TU_BD
# Usuario y clave de esa conexión (Workbench no los entrega automáticamente a Java).
db.user=root
db.password=
